

backend:
  replicas: 1
  image:
    repository: taskboard-backend
    tag: local
    pullPolicy: IfNotPresent
  appVersion: ""
  environment: local
  service:
    port: 8000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi
  extraEnv: []

frontend:
  replicas: 1
  image:
    repository: taskboard-frontend
    tag: local
    pullPolicy: IfNotPresent
  service:
    port: 8080
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi

postgres:
  image:
    repository: postgres
    tag: 17-alpine
    pullPolicy: IfNotPresent
  storage:
    size: 1Gi
    storageClass: ""        
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

database:
  name: taskboard
  user: taskboard
  port: 5432

credentials:
 
  mode: plain
  plain:
    password: "1234"
