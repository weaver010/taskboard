name: Security scans
description: Run repository and container security scans with pinned scanner images
inputs:
  backend-image:
    description: Fully qualified backend image reference to scan
    required: true
runs:
  using: composite
  steps:
    - name: Prepare report directory
      shell: bash
      run: mkdir -p security-reports

    - name: Gitleaks
      id: gitleaks
      continue-on-error: true
      shell: bash
      run: |
        set -euo pipefail
        docker run --rm -v "$PWD:/src" \
          ghcr.io/gitleaks/gitleaks:v8.30.1 \
          dir /src --redact \
          --report-format sarif \
          --report-path /src/security-reports/gitleaks.sarif

    - name: TruffleHog
      id: trufflehog
      continue-on-error: true
      shell: bash
      run: |
        set -euo pipefail
        docker run --rm -v "$PWD:/src" \
          trufflesecurity/trufflehog:3.99.2 \
          filesystem /src --json \
          --output /src/security-reports/trufflehog.json

    - name: Trivy filesystem
      id: trivy-filesystem
      continue-on-error: true
      shell: bash
      run: |
        set -euo pipefail
        docker run --rm -v "$PWD:/src" \
          aquasec/trivy:0.75.0 \
          fs /src --scanners vuln,secret,misconfig \
          --severity HIGH,CRITICAL \
          --exit-code 1 \
          --format sarif \
          --output /src/security-reports/trivy-filesystem.sarif

    - name: Trivy backend image
      id: trivy-image
      continue-on-error: true
      shell: bash
      run: |
        set -euo pipefail
        docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
          -v "$PWD:/src" \
          aquasec/trivy:0.75.0 \
          image "${{ inputs.backend-image }}" \
          --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
          --format sarif \
          --output /src/security-reports/trivy-image.sarif

    - name: Fail if a security scan found issues
      if: always()
      shell: bash
      run: |
        if [[ "${{ steps.gitleaks.outcome }}" != "success" ||
              "${{ steps.trufflehog.outcome }}" != "success" ||
              "${{ steps.trivy-filesystem.outcome }}" != "success" ||
              "${{ steps.trivy-image.outcome }}" != "success" ]]; then
          echo "One or more security scans reported findings or failed."
          exit 1
        fi
