name: CI, security, and Helm deployment

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ghcr.io/${{ github.repository }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  test:
    name: Test backend and frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Test backend with coverage
        working-directory: backend
        run: pytest --cov=taskboard --cov-report=xml:coverage.xml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Check frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run build

  build:
    name: Build and publish images
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request'
    outputs:
      backend-image: ${{ steps.images.outputs.backend }}
      frontend-image: ${{ steps.images.outputs.frontend }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image references
        id: images
        shell: bash
        run: |
          set -euo pipefail
          namespace="$(echo "${IMAGE_NAMESPACE}" | tr '[:upper:]' '[:lower:]')"
          echo "backend=${namespace}/backend:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "frontend=${namespace}/frontend:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Build backend image
        run: docker build --pull --tag "${{ steps.images.outputs.backend }}" backend

      - name: Build frontend image
        run: docker build --pull --tag "${{ steps.images.outputs.frontend }}" frontend

      - name: Publish images
        run: |
          docker push "${{ steps.images.outputs.backend }}"
          docker push "${{ steps.images.outputs.frontend }}"

  security:
    name: Security scans
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build backend image for scanning
        run: docker build --pull --tag "taskboard-backend:${{ github.sha }}" backend

      - name: Run security scans
        uses: ./.github/actions/security-scan
        with:
          backend-image: taskboard-backend:${{ github.sha }}

      - name: Upload security scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-results-${{ github.sha }}
          path: security-reports/
          if-no-files-found: error
          retention-days: 14

  sonar:
    name: SonarCloud analysis
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Generate backend coverage
        working-directory: backend
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          pytest --cov=taskboard --cov-report=xml:coverage.xml

      - name: Validate SonarCloud settings
        run: |
          test -n "$SONAR_TOKEN"
          test -n "$SONAR_ORGANIZATION"
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}

      - name: Run SonarCloud backend analysis
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: backend
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.qualitygate.wait=true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Prepare frontend analysis
        working-directory: frontend
        run: npm ci

      - name: Run SonarCloud frontend analysis
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: frontend
          args: >
            -Dsonar.organization=weaver010
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.qualitygate.wait=true

      - name: Upload SonarCloud metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonarcloud-results-${{ github.sha }}
          path: |
            backend/.scannerwork/report-task.txt
            backend/coverage.xml
            frontend/.scannerwork/report-task.txt
          if-no-files-found: warn
          retention-days: 14

  deploy:
    name: Deploy Helm release
    runs-on: ubuntu-latest
    needs: [build, security, sonar]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Configure Kubernetes access
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          set -euo pipefail
          test -n "$KUBE_CONFIG"
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBE_CONFIG" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Deploy chart
        env:
          BACKEND_IMAGE: ${{ needs.build.outputs.backend-image }}
          FRONTEND_IMAGE: ${{ needs.build.outputs.frontend-image }}
          KUBE_NAMESPACE: ${{ vars.KUBE_NAMESPACE || 'taskboard' }}
        run: |
          set -euo pipefail
          helm upgrade --install taskboard deploy/Helm/taskboard \
            --namespace "$KUBE_NAMESPACE" \
            --create-namespace \
            --set-string backend.image.repository="${BACKEND_IMAGE%:*}" \
            --set-string backend.image.tag="${BACKEND_IMAGE##*:}" \
            --set-string frontend.image.repository="${FRONTEND_IMAGE%:*}" \
            --set-string frontend.image.tag="${FRONTEND_IMAGE##*:}" \
            --set backend.image.pullPolicy=IfNotPresent \
            --set frontend.image.pullPolicy=IfNotPresent \
            --wait \
            --timeout 10m
